    <!-- ✅ STATIC PRELOADER (paints on first frame, removed by Preloader.tsx) -->
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      #static-preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #ffffff; transition: opacity 0.5s ease-in-out;
      }
      html.dark #static-preloader { background: #030712; }
      #static-preloader.hide { opacity: 0; pointer-events: none; }

      /* Same entrance as the original: scale 0.8 -> 1 and fade in, 0.8s, backOut */
      #static-preloader .inner {
        text-align: center;
        animation: dth-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes dth-pop {
        from { transform: scale(0.8); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }

      #static-preloader img {
        display: block; margin: 0 auto 2rem;
        height: 6rem; width: auto; object-fit: contain;
      }
      @media (min-width: 768px) { #static-preloader img { height: 8rem; } }

      #static-preloader .bar {
        height: 4px; width: 12rem; margin: 0 auto;
        border-radius: 9999px; background: #dbeafe; overflow: hidden;
      }
      html.dark #static-preloader .bar { background: #374151; }
      #static-preloader .bar span {
        display: block; height: 100%; width: 0; border-radius: 9999px; background: #2563eb;
        animation: dth-load 1.5s ease-in-out forwards;
      }
      html.dark #static-preloader .bar span { background: #3b82f6; }
      @keyframes dth-load { to { width: 100%; } }
    </style>
    <noscript><style>#static-preloader { display: none; }</style></noscript>

    <!-- ✅ ANTI-FLASH (FOUC) PROTECTION -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('theme');
          const root = document.documentElement;
          if (savedTheme === 'dark') {
            root.classList.add('dark');
          } else if (savedTheme === 'light') {
            root.classList.remove('dark');
          } else {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              root.classList.add('dark');
            } else {
              root.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
    </script>

  <body class="antialiased min-h-screen flex flex-col scroll-smooth">
    <!-- Static preloader: visible from first paint, removed by Preloader.tsx -->
    <div id="static-preloader" aria-hidden="true">
      <div class="inner">
        <img src="/logo.png" alt="" />
        <div class="bar"><span></span></div>
      </div>
    </div>
    <script>
      // Failsafe: never leave visitors stuck on the preloader if the app fails to load
      (function () {
        if (window.__PRERENDER__) return;
        setTimeout(function () {
          var el = document.getElementById('static-preloader');
          if (!el) return;
          el.classList.add('hide');
          setTimeout(function () { el.remove(); }, 500);
        }, 4000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
